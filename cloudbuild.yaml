steps:
  # 1. Build Docker image with Google Cloud Build
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "build",
        "-t",
        "gcr.io/$PROJECT_ID/careloop-ai:$COMMIT_SHA",
        "-t",
        "gcr.io/$PROJECT_ID/careloop-ai:latest",
        ".",
      ]

  # 2. Push image to Container Registry / Artifact Registry
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/$PROJECT_ID/careloop-ai:$COMMIT_SHA"]

  # 3. Deploy to Google Cloud Run (stateless container)
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      [
        "run",
        "deploy",
        "careloop-ai",
        "--image",
        "gcr.io/$PROJECT_ID/careloop-ai:$COMMIT_SHA",
        "--region",
        "us-central1",
        "--platform",
        "managed",
        "--allow-unauthenticated",
        "--set-env-vars",
        "NODE_ENV=production",
      ]

images:
  - "gcr.io/$PROJECT_ID/careloop-ai:$COMMIT_SHA"
  - "gcr.io/$PROJECT_ID/careloop-ai:latest"
